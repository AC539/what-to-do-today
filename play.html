<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFE1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天干嘛">
<meta name="format-detection" content="telephone=no">
<title>今天干嘛</title>
<style>
/* ============================================================
   今天干嘛 · 手机版 · Q 版老虎机外形
   外形语言移植自用户的「萌虎幸运机」：
   橙色机身 + 虎耳 + 萌脸 + 灯带招牌 + 跑马灯泡 + 拉杆 + 糖果按钮
   逻辑与数据仍是本项目自己的。
   --cell 只影响视觉，JS 运行时量 reel.clientHeight，不必同步常量。
   ============================================================ */
:root{
  --cell:168px;
  --orange:#FF9E4F;      /* 机身主色 */
  --orange-d:#E07B2E;    /* 深橙（虎纹/阴影） */
  --pink:#FF8FB1;        /* 粉装饰 */
  --pink-d:#F4517F;      /* 深粉（拉杆球/强调） */
  --cream:#FFF6E5;       /* 米白（招牌/底色） */
  --brown:#7A4A21;       /* 主文字色 */
  --yellow:#FFE27A;      /* 灯泡黄 */
  --ink3:#B99169;        /* 弱文字 */
  --cute:"Yuanti SC","YouYuan","ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  color:var(--brown);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(circle, rgba(255,255,255,.55) 2.5px, transparent 3px) 0 0/30px 30px,
    linear-gradient(165deg,#FFF6DE 0%,#FFE1EE 55%,#DDF2FF 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  overflow:hidden;
  user-select:none;
  overscroll-behavior:none;
}

.stage{
  width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,20px) + 6px) 13px calc(env(safe-area-inset-bottom,16px) + 10px);
  position:relative;
  overflow:hidden;
}

/* ---------- 背景漂浮装饰 ---------- */
.float-emoji{
  position:absolute;font-size:22px;opacity:.6;z-index:0;pointer-events:none;
  animation:floaty 6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}

/* ---------- 顶栏：日期 + 声音 ---------- */
.topbar{
  position:relative;z-index:5;flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;
  padding:2px 1px 0;
}
.date-pill{
  display:flex;align-items:center;background:rgba(255,255,255,.88);
  border-radius:999px;padding:8px 16px;
  box-shadow:0 3px 0 rgba(214,140,60,.35), 0 6px 14px rgba(180,90,60,.15);
  font-weight:800;font-size:14px;color:var(--brown);letter-spacing:.5px;
}
.icon-btn{
  width:44px;height:44px;padding:0;border:3px solid #fff;border-radius:50%;
  background:linear-gradient(180deg,#FFD98A,#FFB84D);
  box-shadow:0 3px 0 #DE9340, 0 6px 12px rgba(180,90,60,.2);
  font-size:17px;line-height:1;display:grid;place-items:center;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #DE9340}
.icon-btn.dim{filter:grayscale(.55) brightness(1.06)}

/* ---------- 机器区 ---------- */
.marea{
  flex:1 1 auto;min-height:0;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 0 4px;   /* 上面留出虎耳 */
}

.machine{
  position:relative;width:96%;
  background:linear-gradient(180deg,#FFC069 0%,#FF9E4F 78%,#F58A3C 100%);
  border:4px solid rgba(255,255,255,.7);border-radius:44px;
  padding:14px 16px 18px;
  box-shadow:0 16px 30px rgba(190,95,30,.28),
             inset 0 5px 0 rgba(255,255,255,.5),
             inset 0 -9px 0 rgba(150,70,10,.14);
  transform-origin:50% 60%;
  animation:wiggle 6s ease-in-out infinite;
}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(.3deg)}}
.machine.rolling{animation:rumble .12s linear infinite}
@keyframes rumble{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-1.6px,.7px) rotate(-.25deg)}
  50%{transform:translate(1.4px,-.9px) rotate(.25deg)}
  75%{transform:translate(-.9px,-.6px) rotate(.15deg)}
  100%{transform:translate(1px,.8px) rotate(-.15deg)}
}
.machine.ding{animation:ding .5s cubic-bezier(.34,1.7,.5,1)}
@keyframes ding{
  0%{transform:scale(1)}
  35%{transform:scale(1.035) translateY(-3px)}
  65%{transform:scale(.99) translateY(1px)}
  100%{transform:scale(1)}
}

/* 虎耳 */
.ear{
  position:absolute;top:-22px;width:62px;height:54px;background:var(--orange);
  border:4px solid rgba(255,255,255,.7);border-bottom:none;
  border-radius:50% 50% 46% 54% / 72% 72% 30% 30%;z-index:0;
}
.ear::after{content:"";position:absolute;inset:12px 15px 6px;background:#FFB3C6;border-radius:inherit}
.ear.l{left:30px;transform:rotate(-14deg)}
.ear.r{right:30px;transform:rotate(14deg)}
.machine.rolling .ear.l,.machine.ding .ear.l{animation:earwigL .32s ease-in-out infinite alternate}
.machine.rolling .ear.r,.machine.ding .ear.r{animation:earwigR .32s .08s ease-in-out infinite alternate}
@keyframes earwigL{from{transform:rotate(-14deg) scale(1)}to{transform:rotate(-6deg) scale(1.07)}}
@keyframes earwigR{from{transform:rotate(14deg) scale(1)}to{transform:rotate(6deg) scale(1.07)}}

/* 灯带招牌 */
.marquee{
  position:relative;z-index:2;background:var(--cream);border-radius:22px;
  padding:7px 10px 8px;margin-bottom:8px;
  box-shadow:inset 0 3px 8px rgba(150,80,20,.18), 0 3px 0 rgba(255,255,255,.5);
}
.bulbs{display:flex;justify-content:space-between;padding:1px 6px}
.bulb{
  width:8px;height:8px;border-radius:50%;background:var(--yellow);
  animation:glow 1.1s ease-in-out infinite alternate;
}
.bulb:nth-child(even){background:#FFAFCE;animation-delay:.55s}
@keyframes glow{
  from{opacity:.35;box-shadow:0 0 0 rgba(255,210,90,0)}
  to{opacity:1;box-shadow:0 0 8px 2px rgba(255,200,90,.85)}
}
.machine.rolling .bulb{animation-duration:.22s}
.mtitle{
  text-align:center;font-family:var(--cute);font-size:27px;font-weight:700;
  color:#E2683C;letter-spacing:3px;line-height:1.12;margin-top:1px;
  text-shadow:0 2px 0 #FFE3C2;
}
.msub{text-align:center;font-size:9px;font-weight:800;letter-spacing:3.4px;color:#C98B4E;margin-top:1px}

/* 萌脸 */
.face{position:relative;width:178px;height:62px;margin:6px auto 2px;z-index:2}
.eye{
  position:absolute;top:2px;width:33px;height:33px;background:#fff;border-radius:50%;
  display:grid;place-items:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.05), 0 2px 4px rgba(150,80,20,.2);
  animation:blink 4.6s infinite;
}
.eye.l{left:20px}
.eye.r{right:20px}
.eye i{width:14px;height:14px;background:#4A2C17;border-radius:50%;position:relative}
.eye i::after{content:"";position:absolute;top:2px;left:2.5px;width:5px;height:5px;background:#fff;border-radius:50%}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.blush{position:absolute;top:28px;width:22px;height:11px;background:#FFB3C6;border-radius:50%;opacity:.85}
.blush.l{left:2px}
.blush.r{right:2px}
.nose{
  position:absolute;top:33px;left:50%;transform:translateX(-50%);
  width:18px;height:14px;background:var(--pink-d);border-radius:46% 46% 60% 60%;
}
.mouth{position:absolute;top:46px;left:50%;transform:translateX(-50%);width:30px;height:12px}
.mouth::before,.mouth::after{
  content:"";position:absolute;top:0;width:13px;height:8px;
  border:3px solid #A5583F;border-top:none;border-radius:0 0 14px 14px;
}
.mouth::before{left:0}
.mouth::after{right:0}
.st{position:absolute;width:17px;height:6px;background:var(--orange-d);border-radius:4px;opacity:.85}
.st.s1{left:0;top:6px;transform:rotate(-68deg)}
.st.s2{left:-6px;top:18px;transform:rotate(-90deg)}
.st.s3{left:0;top:30px;transform:rotate(-112deg)}
.st.s4{right:0;top:6px;transform:rotate(68deg)}
.st.s5{right:-6px;top:18px;transform:rotate(90deg)}
.st.s6{right:0;top:30px;transform:rotate(112deg)}

/* 列标题 */
.rlabels{display:flex;gap:7px;margin:2px 0 7px;position:relative;z-index:2}
.rl{
  flex:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:0;
  padding:4px 0 5px;border-radius:9px;white-space:nowrap;
  background:rgba(255,255,255,.5);color:#A56A2C;
  box-shadow:inset 0 2px 4px rgba(150,80,20,.12);
}
.rl.p{background:#FFE1EC;color:#D2426E}
.rl.e{background:#FFF0C9;color:#B07408}

/* 转轮窗口 */
.winwrap{position:relative;z-index:2}
/* 窗口总高 = 格高 + 上下 10px 内边距，保证 .reel.clientHeight 正好等于 --cell */
.reels-window{
  position:relative;height:calc(var(--cell) + 20px);
  background:#FFFDF6;border-radius:22px;padding:10px;
  box-shadow:inset 0 5px 12px rgba(150,80,20,.22);
  display:flex;gap:7px;overflow:hidden;
}
.reel{
  flex:1;border-radius:14px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#FFFFFF,#FFF3E0);
  box-shadow:inset 0 3px 7px rgba(150,80,20,.16);
}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:26px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(180deg,rgba(200,120,40,.22),transparent)}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(200,120,40,.22),transparent)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip.moving{filter:blur(1.5px) saturate(1.25)}
.reel.win{animation:pop .45s cubic-bezier(.34,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

.cell{
  height:var(--cell);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px 3px;text-align:center;
}
.cell .badge{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.08), inset 0 -2px 0 rgba(0,0,0,.07);
}
.cell .badge svg{width:24px;height:24px;display:block}
.cell .nm{
  font-size:13px;font-weight:700;line-height:1.24;color:var(--brown);
  word-break:break-all;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.cell .tg{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:0}
.cell .area{
  font-size:9.5px;font-weight:700;color:#B0703A;
  background:rgba(255,180,90,.26);border-radius:7px;padding:1px 6px;line-height:1.5;
}
.cell.blank .nm{color:var(--ink3);font-weight:600}
.cell.blank .badge{background:rgba(255,180,90,.3)!important;color:var(--ink3)}

.pay-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:4;
  font-size:12px;color:var(--pink-d);text-shadow:0 1px 0 #fff;pointer-events:none;
}
.pay-arrow.l{left:1px}
.pay-arrow.r{right:1px}

/* 信息横幅 */
.win-banner{
  min-height:30px;margin:9px 4px 0;text-align:center;position:relative;z-index:2;
  font-family:var(--cute);font-size:17px;font-weight:700;color:#7A4A21;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.win-banner.pop{animation:pop2 .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* 拉杆（挂在窗口右侧，探出机器外面）
   注意：原版的黄色杆子放在橙色机身上是看不见的，这里换成奶白杆 + 深棕底座 */
.lever{
  position:absolute;right:-34px;bottom:-46px;
  width:32px;height:132px;z-index:3;cursor:grab;touch-action:none;
}
.lever-base{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:28px;height:26px;border-radius:11px;border:3px solid rgba(255,255,255,.75);
  background:linear-gradient(180deg,#A85A24,#7A3D12);
  box-shadow:0 3px 6px rgba(120,60,10,.3);
}
.stick{
  position:absolute;bottom:19px;left:50%;transform-origin:bottom center;
  transform:translateX(-50%);
  width:12px;height:86px;border-radius:7px;
  background:linear-gradient(180deg,#FFFDF6,#E9D6B8);
  border:2px solid rgba(150,80,20,.35);
  transition:transform .22s cubic-bezier(.3,1.5,.5,1);
}
.stick .ball{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  width:30px;height:30px;border-radius:50%;border:3px solid #fff;
  background:radial-gradient(circle at 32% 28%, #FF9FB2, #F4517F 72%);
  box-shadow:0 4px 8px rgba(150,40,70,.35);
}
.lever.pulled .stick{transform:translateX(-50%) scaleY(.42)}

/* 机身里的控制区（圆钮跟原版一样长在机器底部） */
.controls{position:relative;z-index:2;display:flex;justify-content:center;margin-top:10px}

/* ---------- 按钮区（机身外面只剩"看今天的安排"） ---------- */
.cta{
  flex:0 0 auto;position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px;
}
.spin{
  width:92px;height:92px;padding:0;border:5px solid #fff;border-radius:50%;
  background:radial-gradient(circle at 32% 26%, #FFE98A, #FFB03A 72%);
  box-shadow:0 7px 0 #D97A2B, 0 14px 20px rgba(150,70,10,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--cute);color:#8A4A12;
  transition:transform .1s, box-shadow .1s;
}
.spin .txt{font-size:18px;font-weight:700;letter-spacing:1.5px;white-space:nowrap}
.spin:active{transform:translateY(5px);box-shadow:0 2px 0 #D97A2B, 0 6px 10px rgba(150,70,10,.25)}
.spin:disabled{filter:saturate(.55) brightness(.95)}

.detail{
  width:100%;height:56px;padding:0;border:0;border-radius:28px;
  background:linear-gradient(180deg,#FF9FB2,#F4517F);
  box-shadow:0 5px 0 #C93A64, 0 12px 18px rgba(200,60,100,.25);
  color:#fff;font-family:var(--cute);font-size:17px;font-weight:700;letter-spacing:1.5px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;
  max-height:0;overflow:hidden;margin-top:-10px;
  transition:opacity .3s, transform .34s cubic-bezier(.34,1.6,.5,1);
}
.detail.on{opacity:1;transform:none;pointer-events:auto;max-height:70px;margin-top:0}
.detail:active{transform:translateY(4px);box-shadow:0 1px 0 #C93A64}
.detail svg{width:17px;height:17px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,16px) + 92px);
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(122,74,33,.94);color:#fff;font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:999px;z-index:99;
  transition:.26s;max-width:80%;text-align:center;line-height:1.5;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   详情卡片（Step 2）：从屏幕底部升起来，摊开一整天
   时间轴三栏 = 时间 | 轨道(圆点+连线) | 内容卡，跟桌面版一套语言
   ============================================================ */
.sheet-mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(72,38,8,.48);
  opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.sheet-mask.on{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  width:100%;max-width:480px;margin:0 auto;
  max-height:80vh;max-height:80dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFFDF6 0%,#FFF4E4 100%);
  border:4px solid rgba(255,255,255,.85);border-bottom:none;
  border-radius:30px 30px 0 0;
  box-shadow:0 -12px 34px rgba(120,60,10,.32);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
  transform:translateY(103%);
  transition:transform .38s cubic-bezier(.22,1.06,.36,1);
  will-change:transform;
}
.sheet.on{transform:translateY(0)}

.sheet-grip{
  flex:0 0 auto;width:46px;height:5px;border-radius:3px;background:#E7CBA2;
  margin:9px auto 4px;cursor:grab;touch-action:none;
}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:2px 14px 9px;border-bottom:2px dashed rgba(214,160,90,.34);
  touch-action:none;
}
.sh-txt{flex:1;min-width:0;padding-left:2px}
.sh-t{
  font-family:var(--cute);font-size:21px;font-weight:700;color:#E2683C;
  letter-spacing:1.5px;line-height:1.18;
}
.sh-s{
  font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:2px;
  letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sh-close{
  flex:0 0 46px;width:46px;height:46px;padding:0;
  border:3px solid #fff;border-radius:50%;
  background:linear-gradient(180deg,#FFD98A,#FFB84D);
  box-shadow:0 3px 0 #DE9340;
  font-size:16px;font-weight:800;color:#8A4A12;line-height:1;
  display:grid;place-items:center;
}
.sh-close:active{transform:translateY(3px);box-shadow:0 1px 0 #DE9340}

.sheet-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px 6px;overscroll-behavior:contain;
}
.tl-empty{
  text-align:center;color:var(--ink3);font-size:13.5px;font-weight:700;
  padding:26px 10px;line-height:1.9;
}

.tl{display:flex;flex-direction:column}

.tl-row{display:grid;grid-template-columns:42px 20px 1fr;align-items:stretch}
.tl-time{
  font-size:12.5px;font-weight:800;color:#A56A2C;text-align:right;
  padding:4px 6px 0 0;font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail i{
  position:relative;z-index:2;width:14px;height:14px;border-radius:50%;
  margin-top:5px;border:2.5px solid #FFFDF6;
  box-shadow:0 1px 4px rgba(150,80,20,.4);
}
.tl-rail s{
  position:absolute;top:19px;bottom:-5px;width:2.5px;border-radius:2px;
  background:rgba(206,148,74,.62);text-decoration:none;
}
.tl-row:last-child .tl-rail s{display:none}

.tl-body{
  background:rgba(255,255,255,.82);
  border:2px solid rgba(255,255,255,.95);border-radius:16px;
  padding:9px 12px 11px;margin:0 0 12px 5px;
  box-shadow:0 3px 10px rgba(180,110,40,.13);
}
.tl-row:last-child .tl-body{margin-bottom:2px}
.tl-body .k{
  display:inline-block;font-size:10.5px;font-weight:800;color:#fff;
  letter-spacing:.8px;padding:2.5px 9px;border-radius:9px;
  background:linear-gradient(180deg,#FFB84D,#EE8F16);
}
.tl-body .k.p{background:linear-gradient(180deg,#FF9FB2,#F4517F)}
.tl-body .k.e{background:linear-gradient(180deg,#FFC93C,#F09A18)}
.tl-body .v{
  font-size:15.5px;font-weight:700;color:var(--brown);line-height:1.32;
  margin-top:5px;word-break:break-word;
}
.tl-body .p{font-size:11.5px;font-weight:600;color:var(--ink3);line-height:1.55;margin-top:3px}
.tl-body .tip{font-size:11.5px;font-weight:600;color:#C2894F;line-height:1.55;margin-top:4px}
.tl-body .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tl-body .tags .tg{
  font-size:10px;font-weight:700;color:#A56A2C;
  background:rgba(255,196,110,.36);border-radius:7px;padding:2px 7px;line-height:1.5;
}

["威士忌吧",           "e","酒吧","锦江",3,2,  "夜生活,安静,小贵",      "太古里周边, 适合聊天"],
["路边摊喝啤酒",       "e","酒吧","不限",1,1.5,"夜生活,便宜,热闹",      "烧烤摊配冰啤, 夏天最舒服"],

["酒店自助早餐",       "e","西餐","锦江",3,1.5,"慢,请客",              "周末早上慢慢吃, 当早午餐"],

/* ============ 吃 · 家里也能算 ============ */
["自己煮一锅小面",     "e","面食","不限",1,0.7,"省钱,家里",            "不用出门, 但要说好谁洗碗"],
["点外卖在家吃",       "e","不限","不限",1,1,  "躺平,省钱,家里",        "摇到这个就认命, 至少点个没点过的"],

<script>
/* 今天干嘛 · 手机版 app.js
   Step 1（已完成）：四个滚轮（上午玩 / 中午吃 / 下午玩 / 晚上吃）→ 摇 → 出结果。
   Step 2（已完成）：点"看今天的安排"→ 底部升起卡片，摊开一整天的 5 站
                    （上午玩 / 午饭 / 下午玩 / 晚饭 / 晚上，后两站自动补）。 */
(function(){
'use strict';

/* ===================== 常量 ===================== */
var KEY = 'jtmgz_phone_v1';
var CITY = ['锦江','青羊','金牛','武侯','成华','高新','天府'];

var IC_PLAY = '<svg viewBox="0 0 24 24"><path d="M2.5 20L9 7.5l4.2 7.2L16.4 10 22 20H2.5Z" fill="currentColor"/></svg>';
var IC_EAT  = '<svg viewBox="0 0 24 24"><path d="M2 11.5h20a10 10 0 0 1-20 0Z" fill="currentColor"/><path d="M9 3.5v5M12 2.5v6M15 3.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>';
var IC_BOOK = '<svg viewBox="0 0 24 24"><path d="M4 4.5h6a3 3 0 0 1 3 3v12a2.4 2.4 0 0 0-2.4-2.4H4V4.5Z" fill="currentColor"/><path d="M20 4.5h-6a3 3 0 0 0-3 3v12a2.4 2.4 0 0 1 2.4-2.4H20V4.5Z" fill="currentColor" opacity=".5"/></svg>';
var IC_MOON = '<svg viewBox="0 0 24 24"><path d="M15.5 2.5a9.5 9.5 0 1 0 6 15.2A8 8 0 0 1 15.5 2.5Z" fill="currentColor"/></svg>';
var IC_SPORT= '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v18M3.5 12h17" stroke="currentColor" stroke-width="1.5" opacity=".55"/></svg>';

/* Q 版糖果色，跟 style.css 里的 --pink/--orange/... 一套 */
var RAMP = ['#FF7A9C','#FF9F45','#FFC93C','#38C6D9','#7C6BF0','#5AC878','#FF6B5A'];

var BOOK_SUBS  = ['书店','展览','博物馆'];
var NIGHT_SUBS = ['夜生活','演出','酒吧'];
var SPORT_SUBS = ['运动'];
var LIGHT_SUBS = ['甜品','咖啡','茶'];                                   /* 不适合当正餐 */
var FULL_SUBS  = ['火锅','串串','川菜','家常','面食','烧烤','夜宵','异国','粤菜','日料','韩餐','西餐','素食','早餐','不限'];

/* ===================== 状态 ===================== */
function defState(){
  return { recent:[], banned:[], fav:[], mute:false, rolls:[null,null,null,null], spins:0, nightId:null };
}
var S = defState();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var o = JSON.parse(raw), d = defState();
    for(var k in d){ if(o[k]!==undefined) d[k] = o[k]; }
    S = d;
  }catch(e){ S = defState(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ===================== 数据 ===================== */
var LIB = [];
var IDX = {};                       /* id -> item，用来把上次存的结果还原回来 */
function mk(name,type,sub,area,price,dur,tags,tip,id){
  return {
    id:id, name:name, type:type, sub:sub, area:area,
    price:price||2, dur:dur||2,
    tags:String(tags||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean),
    tip:tip||''
  };
}
function buildLib(){
  var raw = window.POOL_RAW || [];
  LIB = raw.map(function(r,i){ return mk(r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],'L'+i); });
  IDX = {};
  LIB.forEach(function(it){ IDX[it.id] = it; });
}
function byId(id){ return IDX[id] || null; }
function hasTag(it,t){ return it.tags.indexOf(t)>=0; }
function subIn(it,arr){ return arr.indexOf(it.sub)>=0; }
function isNightOnly(it){ return hasTag(it,'夜生活') || it.sub==='酒吧' || it.sub==='夜生活'; }
function isFav(id){ return S.fav.indexOf(id)>=0; }

/* ===================== 抽取 ===================== */
function soft(list,fn,min){
  var f = list.filter(fn);
  return f.length >= (min||6) ? f : list;
}
function relaxed(type,skip){
  skip = skip||[];
  var p = LIB.filter(function(it){
    return it.type===type && skip.indexOf(it.id)<0 && S.banned.indexOf(it.id)<0;
  });
  if(!p.length) p = LIB.filter(function(it){ return it.type===type; });
  /* 优先市内（"不限"也算），够多就只用市内的 */
  p = soft(p, function(it){ return it.area==='不限' || CITY.indexOf(it.area)>=0; }, 8);
  /* 优先最近没摇到过的，避免连着重复 */
  p = soft(p, function(it){ return S.recent.indexOf(it.id)<0; }, 8);
  return p;
}
function weighted(p){
  if(!p || !p.length) return null;
  var tot=0, w=[];
  for(var i=0;i<p.length;i++){ var x = isFav(p[i].id)?3:1; w.push(x); tot+=x; }
  var r = Math.random()*tot;
  for(var j=0;j<p.length;j++){ r -= w[j]; if(r<=0) return p[j]; }
  return p[p.length-1];
}
function playPool(skip,morning){
  var p = relaxed('p', skip);
  p = soft(p, function(it){ return !isNightOnly(it); }, 6);              /* 白天不摇夜店/酒吧 */
  /* "住一晚"这类整日项目塞不进一天的五个格子，直接排除 */
  p = soft(p, function(it){ return (it.dur||2) < 12; }, 6);
  /* 上午的项目别太长，否则"午饭"要排到下午去 */
  if(morning) p = soft(p, function(it){ return (it.dur||2) <= 3; }, 6);
  /* 下午可以长一点，但别长到把晚上拖进后半夜 */
  else        p = soft(p, function(it){ return (it.dur||2) <= 5; }, 6);
  return p;
}
function mealPool(skip,isLunch){
  var p = relaxed('e', skip);
  p = soft(p, function(it){ return FULL_SUBS.indexOf(it.sub)>=0; }, 8);
  p = soft(p, function(it){ return LIGHT_SUBS.indexOf(it.sub)<0; }, 8);   /* 甜品/咖啡/茶 不当正餐 */
  p = soft(p, function(it){ return it.sub!=='酒吧'; }, 6);                /* 酒吧不算"吃" */
  if(isLunch){
    p = soft(p, function(it){ return !hasTag(it,'夜宵'); }, 8);           /* 中午别排夜宵 */
  }
  return p;
}
function pickPlay(skip,morning){ return weighted(playPool(skip,morning)); }
function pickMeal(skip,isLunch){ return weighted(mealPool(skip,isLunch)); }
/* 晚上那一站：只从"夜里才成立"的条目里挑（酒吧 / 夜生活 / 演出） */
function pickNight(skip){
  skip = skip||[];
  var p = LIB.filter(function(it){
    return isNightOnly(it) && skip.indexOf(it.id)<0 && S.banned.indexOf(it.id)<0;
  });
  if(p.length < 3) p = LIB.filter(function(it){ return isNightOnly(it) && skip.indexOf(it.id)<0; });
  if(!p.length)    p = LIB.filter(function(it){ return isNightOnly(it); });
  return weighted(p);
}

/* 某一列该从哪个池子里取（静置铺底和滚动填充都用它，跟正式摇的逻辑保持一致，
   否则「中午吃」那列会飘出酒吧） */
function reelPool(el){
  var label = el.getAttribute('data-label');
  if(el.getAttribute('data-type') === 'e') return mealPool([], label === '中午吃');
  return playPool([], label === '上午玩');
}

/* ===================== 小工具 ===================== */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function colorOf(it){
  var s = it.sub||'x', h = 0;
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return RAMP[h % RAMP.length];
}
function iconOf(it){
  if(subIn(it,BOOK_SUBS))  return IC_BOOK;
  if(subIn(it,NIGHT_SUBS)) return IC_MOON;
  if(subIn(it,SPORT_SUBS)) return IC_SPORT;
  return it.type==='e' ? IC_EAT : IC_PLAY;
}
var tTimer=null;
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(tTimer);
  tTimer = setTimeout(function(){ t.classList.remove('on'); }, 2000);
}

/* ===================== 音效（可关） ===================== */
var AC = null;
function ac(){
  if(AC === null){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ AC = false; }
  }
  if(AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
  return AC || null;
}
function beep(f,dur,type,vol,delay){
  if(S.mute) return;
  var c = ac(); if(!c) return;
  try{
    var t0 = c.currentTime + (delay||0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol||0.05, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function sfxStart(){
  beep(300,0.08,'triangle',0.045,0);
  beep(400,0.08,'triangle',0.04,0.10);
  beep(520,0.10,'triangle',0.035,0.20);
}
function sfxStop(i){
  beep(620 + i*130, 0.09, 'square', 0.030, 0);
}
function sfxWin(){
  beep(784,0.15,'sine',0.070,0);
  beep(1046,0.16,'sine',0.055,0.09);
  beep(1318,0.30,'sine',0.040,0.18);
}
function vib(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

/* ===================== 滚轮渲染 ===================== */
function reelEls(){ return Array.prototype.slice.call(document.querySelectorAll('#reels .reel')); }
function rowH(){
  var r = reelEls()[0];
  return r ? Math.round(r.clientHeight) : 168;
}
function cellHTML(it){
  if(!it) return '<div class="cell blank"><div class="badge"></div><div class="nm">—</div></div>';
  var c = colorOf(it);
  return '<div class="cell">'+
    '<div class="badge" style="background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.5), rgba(255,255,255,0) 64%), '+c+';color:#fff">'+iconOf(it)+'</div>'+
    '<div class="nm">'+esc(it.name)+'</div>'+
    '<div class="tg">'+esc(it.sub)+'</div>'+
    /* 区域标签永远渲染：没有固定地点的（"不限"）留空占位，否则各列内容会上下错开 */
    (it.area && it.area!=='不限'
      ? '<div class="area">'+esc(it.area)+'</div>'
      : '<div class="area" style="visibility:hidden">·</div>')+
  '</div>';
}
function fillStrip(el,seq){
  el.innerHTML = seq.map(function(x){ return cellHTML(x); }).join('');
}
/* 初始静置：每格先塞几个真实条目，看着像台老虎机，而不是空窗口 */
function idleReels(){
  var els = reelEls(), H = rowH();
  els.forEach(function(el){
    var src = reelPool(el);
    if(!src.length) src = LIB;
    var seq = [];
    for(var k=0;k<8;k++) seq.push(src[Math.floor(Math.random()*src.length)]);
    fillStrip(el.querySelector('.strip'), seq);
    el.querySelector('.strip').style.transition = 'none';
    el.querySelector('.strip').style.transform = 'translateY(' + (-(2+Math.floor(Math.random()*3))*H) + 'px)';
  });
}
function rollReel(el,item,dur){
  var strip = el.querySelector('.strip');
  var H = rowH();
  var src = reelPool(el);
  if(!src.length) src = [item];
  var seq = [];
  for(var i=0;i<16;i++) seq.push(src[Math.floor(Math.random()*src.length)]);
  seq.push(item);
  fillStrip(strip, seq);
  strip.classList.add('moving');                              /* 转的时候加运动模糊 */
  strip.style.transition = 'none';
  strip.style.transform  = 'translateY(0px)';
  void strip.offsetHeight;                                   /* 强制回流，否则不animate */
  strip.style.transition = 'transform ' + dur + 's cubic-bezier(.13,.75,.24,1)';
  strip.style.transform  = 'translateY(' + (-(seq.length-1)*H) + 'px)';
  setTimeout(function(){ strip.classList.remove('moving'); }, dur*1000 + 40);
}

/* ===================== 摇 ===================== */
/* 一整天四格：上午玩 / 中午吃 / 下午玩 / 晚上吃
   格子的 data-type 顺序必须是 p e p e —— 改这里就要改 tpl.html 里的 .reel */
var SLOT_LUNCH = 1, SLOT_DINNER = 3;
var rolls = [null,null,null,null];
var rolling = false;
var spun = false;

/* 横幅一句话（招牌下面那行字） */
function setBanner(txt,pop){
  var b = document.getElementById('banner');
  if(!b) return;
  b.textContent = txt;
  if(pop){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
}
/* 主按钮里那行字（按钮里还有个小骰子，别整个 textContent 覆盖掉） */
function spinLabel(txt){
  var t = document.querySelector('#btnPull .txt');
  if(t) t.textContent = txt;
}
/* 彩带：跟「萌虎幸运机」一套，摇完从天而降 */
function confetti(){
  var layer = document.getElementById('confettiLayer');
  if(!layer) return;
  var colors = RAMP.concat(['#FFE27A','#FFD98A','#FFAFCE']);
  for(var i=0;i<16;i++){
    var c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (3 + Math.random()*94).toFixed(1) + '%';
    c.style.width  = (6 + Math.random()*5).toFixed(0) + 'px';
    c.style.height = (9 + Math.random()*7).toFixed(0) + 'px';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.5 + Math.random()*1.1).toFixed(2) + 's';
    c.style.animationDelay = (Math.random()*0.28).toFixed(2) + 's';
    layer.appendChild(c);
    (function(x){ setTimeout(function(){ if(x.parentNode) x.parentNode.removeChild(x); }, 3200); })(c);
  }
}

function doSpin(){
  if(rolling) return;
  rolling = true;
  var pull  = document.getElementById('btnPull');
  var mach  = document.getElementById('machine');
  var lever = document.getElementById('lever');
  pull.disabled = true;
  mach.classList.add('rolling');
  lever.classList.add('pulled');
  vib([12,36,12]);
  sfxStart();
  setBanner('转啊转…看今天怎么过～');

  var els = reelEls(), used = [], N = els.length;
  for(var i=0;i<N;i++){
    var it;
    if(i===SLOT_LUNCH)       it = pickMeal(used, true);    /* 中午：排除夜宵 */
    else if(i===SLOT_DINNER) it = pickMeal(used, false);   /* 晚上：可能是夜宵 */
    else                     it = pickPlay(used, i===0);    /* 第0格是上午，别排长项目 */
    if(it) used.push(it.id);
    rolls[i] = it;
  }

  var longest = 0;
  for(var j=0;j<N;j++){
    var d = 1.05 + j*0.26;
    if(d>longest) longest = d;
    (function(el,item,delay,idx){
      setTimeout(function(){
        rollReel(el,item,delay);
        setTimeout(function(){ sfxStop(idx); }, delay*1000*0.82);
      }, 60);
    })(els[j], rolls[j], d, j);
  }

  setTimeout(function(){
    mach.classList.remove('rolling');
    lever.classList.remove('pulled');
    els.forEach(function(el){
      el.classList.add('win');
      setTimeout(function(){ el.classList.remove('win'); }, 470);
    });
    vib(18);
    sfxWin();
    confetti();

    rolls.forEach(function(x){ if(!x) return; S.recent.unshift(x.id); });
    /* 连续摇也不至于把池子摇空：只记最近 60 条 */
    var seen = {};
    S.recent = S.recent.filter(function(id){
      if(seen[id]) return false;
      seen[id] = true;
      return true;
    }).slice(0,60);
    S.rolls = rolls.map(function(x){ return x ? x.id : null; });
    S.spins = (S.spins||0) + 1;

    S.nightId = null;                          /* 新的一把，"晚上"那站重新挑 */
    plan = planOf();                           /* 整天安排在这一刻定稿，后面只渲染不重算 */
    var lastSeg = plan[plan.length-1];
    S.nightId = (lastSeg && lastSeg.label === '晚上') ? lastSeg.item.id : null;
    save();

    document.getElementById('btnDetail').classList.add('on');
    setBanner('今天的安排出炉啦 ✨', true);
    spinLabel('再拉一下');
    pull.disabled = false;
    rolling = false;
    spun = true;
  }, 60 + longest*1000 + 300);
}

/* ===================== 详情卡片（Step 2） ===================== */
/* 一整天 = 摇出来的四格 + 自动补的"晚上"一站，共 5 站。
   时间推法跟桌面版一致：有硬下限（午饭 ≥12:00 / 下午玩 ≥14:00 / 晚饭 ≥18:00 / 晚上 ≥20:00），
   站与站之间至少留 40 分钟路上时间。 */
function fmt(m){
  m = Math.round(m/10)*10;
  var h = Math.floor(m/60), mi = m%60;
  return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}
/* 排到半夜以后要写"次日 01:10"，不能印出 25:10 这种怪时间 */
function fmtWrap(m){
  m = Math.round(m/10)*10;
  var next = false;
  while(m >= 1440){ m -= 1440; next = true; }
  var h = Math.floor(m/60), mi = m%60;
  return (next ? '次日 ' : '') + (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}
function planOf(){
  var out = [], t = 10*60, used = [];
  if(rolls[0]){ out.push({t:t,label:'上午玩',type:'p',item:rolls[0]}); t += rolls[0].dur*60; used.push(rolls[0].id); }
  if(rolls[1]){ t = Math.max(t+40, 12*60); out.push({t:t,label:'午饭',type:'e',item:rolls[1]}); t += rolls[1].dur*60; used.push(rolls[1].id); }
  if(rolls[2]){ t = Math.max(t+40, 14*60); out.push({t:t,label:'下午玩',type:'p',item:rolls[2]}); t += rolls[2].dur*60; used.push(rolls[2].id); }

  var din = rolls[3] || pickMeal(used, false);
  if(din){ t = Math.max(t+40, 18*60); out.push({t:t,label:'晚饭',type:'e',item:din,auto:!rolls[3]}); t += din.dur*60; used.push(din.id); }

  var night = (S.nightId && used.indexOf(S.nightId) < 0) ? byId(S.nightId) : null;   /* 上次挑的那站优先复用 */
  if(!night) night = pickNight(used);
  if(night){ t = Math.max(t+40, 20*60); out.push({t:t,label:'晚上',type:night.type,item:night,auto:true}); }

  return out;
}
var plan = [];

function renderDetail(){
  var body = document.getElementById('sheetBody');
  var sub  = document.getElementById('sheetSub');
  /* 整天安排是"摇完即定稿"：这里只渲染，不重算，
     否则每开一次卡片，"晚上"那站会重摇一次，前后看到的不一样 */
  if(!plan.length) plan = planOf();
  if(!plan.length){
    if(body) body.innerHTML = '<div class="tl-empty">还没摇呢～<br>先拉一下那根杆，今天就不用想了。</div>';
    if(sub) sub.textContent = '';
    return;
  }
  var html = '<div class="tl">';
  plan.forEach(function(p){
    var it = p.item;
    if(!it) return;
    var meta = [];
    if(it.area && it.area!=='不限') meta.push(it.area);
    if(it.dur)   meta.push(it.dur>=24 ? '住一晚' : ('约 '+it.dur+' 小时'));
    if(it.price) meta.push(it.price===1 ? '便宜' : it.price===2 ? '人均中档' : '人均偏高');
    var tags = it.tags.slice(0,4).map(function(t){ return '<span class="tg">'+esc(t)+'</span>'; }).join('');
    html += '<div class="tl-row">'+
      '<div class="tl-time">'+fmtWrap(p.t)+'</div>'+
      '<div class="tl-rail"><i style="background:'+colorOf(it)+'"></i><s></s></div>'+
      '<div class="tl-body">'+
        '<div class="k '+p.type+'">'+esc(p.label)+'</div>'+
        (p.auto ? '<span class="auto">自动补的</span>' : '')+
        '<div class="v">'+esc(it.name)+'</div>'+
        '<div class="p">'+meta.join(' · ')+'</div>'+
        (it.tip ? '<div class="tip">'+esc(it.tip)+'</div>' : '')+
        '<div class="tags">'+tags+'</div>'+
      '</div></div>';
  });
  html += '</div>';
  if(body) body.innerHTML = html;

  var n = plan.length;
  var end = plan[n-1].t + (plan[n-1].item.dur||2)*60;
  if(sub) sub.textContent = dateText() + ' · ' + fmtWrap(plan[0].t) + '—' + fmtWrap(end) + ' · 共 ' + n + ' 站';
}

function sheetEl(){ return document.getElementById('sheet'); }
function sheetOpen(){ var s = sheetEl(); return !!s && s.classList.contains('on'); }

function openSheet(){
  renderDetail();
  if(!plan.length){ toast('先拉一下拉杆，摇出今天的安排'); return; }
  var m = document.getElementById('sheetMask'), s = sheetEl();
  m.classList.add('on'); s.classList.add('on');
  s.setAttribute('aria-hidden','false');
  vib(8);
}
function closeSheet(){
  var m = document.getElementById('sheetMask'), s = sheetEl();
  s.classList.remove('on'); m.classList.remove('on');
  s.setAttribute('aria-hidden','true');
  s.style.transform = '';
  document.getElementById('sheetBody').scrollTop = 0;
}

/* ===================== 交互 ===================== */
function bindLever(){
  var lv = document.getElementById('lever');
  var dragging = false;
  lv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    ac();                                   /* 在用户手势里解锁音频 */
    dragging = true;
    lv.classList.add('pulled');
    try{ lv.setPointerCapture(e.pointerId); }catch(err){}
  });
  lv.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging = false;
    doSpin();                               /* 点一下或往下拉一下都算拉杆 */
  });
  lv.addEventListener('pointercancel', function(){
    dragging = false;
    lv.classList.remove('pulled');
  });
}

function bindSound(){
  var b = document.getElementById('btnSnd');
  function paint(){
    b.classList.toggle('dim', !!S.mute);
    b.textContent = S.mute ? '🔇' : '🔊';
    b.setAttribute('aria-pressed', S.mute ? 'true' : 'false');
  }
  paint();
  b.addEventListener('click', function(){
    S.mute = !S.mute;
    save(); paint();
    if(!S.mute){ ac(); beep(880,0.12,'sine',0.06,0); }
  });
}

function bindDetail(){
  document.getElementById('btnDetail').addEventListener('click', function(){
    ac();                       /* 在用户手势里解锁音频 */
    openSheet();
  });
  document.getElementById('sheetMask').addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetAgain').addEventListener('click', function(){
    closeSheet();
    ac();
    setTimeout(doSpin, 140);    /* 先收起卡片，再摇，不然看不到机器转 */
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheetOpen()) closeSheet();
  });

  /* 从把手/标题区往下拖，拖过 78px 就收起 */
  var s = sheetEl();
  var sy = 0, dy = 0, drag = false;
  function down(e){
    /* 标题栏里的 ✕ 是按钮，别被拖拽手势吃掉点击 */
    if(e.target && e.target.closest && e.target.closest('.sh-close')) return;
    drag = true; sy = e.clientY; dy = 0;
    s.style.transition = 'none';
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    if(!drag) return;
    dy = Math.max(0, e.clientY - sy);
    s.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(){
    if(!drag) return;
    drag = false;
    s.style.transition = '';
    /* 先决定收不收，再清 inline transform：
       清掉之后浏览器会从当前位置动画到目标位置，不会闪一下 */
    if(dy > 78){ closeSheet(); }         /* closeSheet 里已清 transform */
    else { s.style.transform = ''; }
    dy = 0;
  }
  [s.querySelector('.sheet-grip'), s.querySelector('.sheet-head')].forEach(function(el){
    if(!el) return;
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}

function bindPull(){
  var b = document.getElementById('btnPull');
  b.addEventListener('click', function(){
    ac();                    /* 在用户手势里解锁音频 */
    doSpin();
  });
}

/* ===================== 启动 ===================== */
function dateText(){
  var d = new Date();
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + w;
}
/* 招牌上下两排小灯泡 */
function fillBulbs(){
  [['bulbsTop',13],['bulbsBot',13]].forEach(function(cfg){
    var box = document.getElementById(cfg[0]);
    if(!box) return;
    var html = '';
    for(var i=0;i<cfg[1];i++) html += '<span class="bulb"></span>';
    box.innerHTML = html;
  });
}

/* 关掉页面再打开：上次摇的四格还认得出，就接着显示，不用重新摇一遍 */
function restoreRolls(){
  if(!S.rolls || S.rolls.length !== 4) return false;
  var got = 0, next = [null,null,null,null];
  for(var i=0;i<4;i++){
    var it = S.rolls[i] ? byId(S.rolls[i]) : null;
    if(it){ next[i] = it; got++; }
  }
  if(got < 4) return false;
  rolls = next;
  return true;
}
/* 把上次的结果直接摆到窗口里（不动画，落在最后一格） */
function showStaticResult(){
  var els = reelEls(), H = rowH();
  els.forEach(function(el,i){
    var src = reelPool(el);
    if(!src.length) src = LIB;
    var seq = [], item = rolls[i] || src[0];
    for(var k=0;k<5;k++) seq.push(src[Math.floor(Math.random()*src.length)]);
    seq.push(item);
    var strip = el.querySelector('.strip');
    fillStrip(strip, seq);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(' + (-(seq.length-1)*H) + 'px)';
  });
}
function paintIdle(){ if(spun) showStaticResult(); else idleReels(); }

function boot(){
  load();
  buildLib();
  fillBulbs();
  document.getElementById('dt').textContent = dateText();

  if(restoreRolls()){
    spun = true;
    plan = planOf();
    document.getElementById('btnDetail').classList.add('on');
    spinLabel('再拉一下');
    setBanner('上次摇的还留着，点下面看安排～');
    showStaticResult();
  }else{
    idleReels();
    setBanner('拉下拉杆，好运降临～');
  }

  bindLever();
  bindPull();
  bindSound();
  bindDetail();

  /* 横竖屏切换会改滚轮高度，重铺一遍静态画面（摇的过程中不动） */
  var tm = null;
  window.addEventListener('resize', function(){
    clearTimeout(tm);
    tm = setTimeout(function(){ if(!rolling) paintIdle(); }, 220);
  });

  if(!LIB.length) toast('内容池没读出来，检查一下 pool.js');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

/* 给自测用：当前这一把的四个结果 + 摊开后的整天安排 */
window.JTMGZ = {
  get rolls(){ return rolls.slice(); },
  get spun(){ return spun; },
  get plan(){                                  /* 读定稿的那一份，不重算 */
    return plan.map(function(p){
      return { t:p.t, time:fmtWrap(p.t), label:p.label, name:p.item && p.item.name,
               sub:p.item && p.item.sub, dur:p.item && p.item.dur,
               tags:p.item ? p.item.tags.slice() : [], auto:!!p.auto };
    });
  },
  get nightPool(){ return LIB.filter(isNightOnly).map(function(it){ return it.name; }); },
  tips: function(){
    return rolls.map(function(x){ return x ? { name:x.name, tip:x.tip, area:x.area, dur:x.dur, price:x.price } : null; });
  }
};

})();
