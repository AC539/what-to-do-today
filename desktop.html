<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天干嘛">
<title>今天干嘛</title>
<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --surface2:#F4F0E8;
  --ink:#22201C; --ink2:#6B6862; --ink3:#A5A096;
  --line:rgba(34,32,28,.09); --line2:rgba(34,32,28,.16);
  --purple:#6C5CE7; --purple-s:#EEEBFF;
  --coral:#FF6B4A; --coral-s:#FFEDE8;
  --mint:#17B890; --mint-s:#E3F7F1;
  --amber:#F5A623; --amber-s:#FFF3E0;
  --blue:#3B8DF0; --blue-s:#E7F1FE;
  --r-l:24px; --r-m:16px; --r-s:10px;
  --sh:0 2px 8px rgba(34,32,28,.05), 0 12px 32px rgba(34,32,28,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none !important}

#app{max-width:480px;margin:0 auto;padding:0 16px 100px;position:relative}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 4px 14px}
.top h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.3px}
.top h1 small{display:block;font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:.4px;margin-top:3px}
.top .date{font-size:12px;color:var(--ink2);text-align:right;line-height:1.5}
.top .date b{display:block;font-size:13px;color:var(--ink);font-weight:600}

/* ---------- 通用卡 ---------- */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-t h2{margin:0;font-size:15px;font-weight:600}
.card-t .lnk{font-size:12px;color:var(--purple);font-weight:500}

/* ---------- 折叠条件 ---------- */
.cond-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.cond-head h2{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.cond-dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
.cond-sum{font-size:11.5px;color:var(--ink3);flex:1;text-align:right;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cond-head .chev{width:18px;height:18px;flex:0 0 18px;transition:transform .25s;color:var(--ink3)}
.cond.open .chev{transform:rotate(180deg)}
.cond-body{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.cond.open .cond-body{display:block}
.row{margin-bottom:12px}
.row:last-child{margin-bottom:0}
.row>label{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:999px;background:var(--surface2);color:var(--ink2);
  font-size:12.5px;font-weight:500;border:1px solid transparent;transition:.16s;line-height:1.3;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}

/* ---------- 老虎机 ---------- */
.machine{
  position:relative;background:var(--surface);border-radius:var(--r-l);
  box-shadow:var(--sh);padding:16px 16px 18px;margin-bottom:14px;
  transition:transform .12s;
}
.machine.rolling{animation:rumble .13s linear infinite}
@keyframes rumble{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-1.4px,.6px) rotate(-.16deg)}
  50%{transform:translate(1.2px,-.8px) rotate(.16deg)}
  75%{transform:translate(-.8px,-.5px) rotate(.1deg)}
  100%{transform:translate(.9px,.7px) rotate(-.1deg)}
}
.machine-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.machine-t .lb{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.3px}
.machine-t .hint{font-size:11px;color:var(--ink3)}

.reels{
  display:flex;gap:9px;background:var(--surface2);
  border-radius:var(--r-m);padding:9px;position:relative;
  margin-right:20px;
}
.reel{
  flex:1;height:104px;overflow:hidden;position:relative;
  background:var(--surface);border-radius:var(--r-s);
  box-shadow:inset 0 0 0 1px var(--line), inset 0 2px 6px rgba(34,32,28,.05);
}
.reel .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{
  height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:6px 5px;text-align:center;
}
.cell .ic{width:26px;height:26px;flex:0 0 26px;color:var(--ink3)}
.cell .ic svg{width:26px;height:26px;display:block}
.cell .tag{font-size:10.5px;color:var(--ink3);font-weight:500;letter-spacing:.2px}
.cell .nm{font-size:12.5px;font-weight:600;line-height:1.25;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reel::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r-s);
  box-shadow:inset 0 10px 12px -10px rgba(34,32,28,.28), inset 0 -10px 12px -10px rgba(34,32,28,.28);
}
.reel.win{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

.lever{position:absolute;right:8px;top:72px;width:24px;height:72px;z-index:3;
  cursor:grab;touch-action:none;border-radius:12px;background:var(--surface2);
  box-shadow:inset 0 0 0 1px var(--line);
  display:flex;flex-direction:column;align-items:center;padding-top:5px}
.lever .knob{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:var(--coral);
  box-shadow:0 2px 6px rgba(255,107,74,.45);transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  position:relative;z-index:2}
.lever .stick{width:6px;height:36px;border-radius:3px;background:#CDC6B6;transition:height .16s}
.lever.pulled .knob{transform:translateY(16px)}
.lever.pulled .stick{height:20px}

.spin-btn{
  width:100%;height:54px;margin-top:14px;border-radius:var(--r-m);
  background:var(--purple);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 18px rgba(108,92,231,.32);transition:.14s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.spin-btn:active{transform:translateY(2px) scale(.985);box-shadow:0 2px 8px rgba(108,92,231,.28)}
.spin-btn:disabled{opacity:.5;box-shadow:none}

/* ---------- 时间轴 ---------- */
.plan-empty{text-align:center;color:var(--ink3);font-size:13px;padding:22px 10px;line-height:1.7}
.tl{position:relative;padding-left:4px}
.tl-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-time{width:42px;flex:0 0 42px;font-size:12px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding-top:2px}
.tl-rail{width:9px;flex:0 0 9px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.tl-rail i{width:9px;height:9px;border-radius:50%;display:block}
.tl-rail s{flex:1;width:1.5px;background:var(--line);display:block;margin-top:3px}
.tl-row:last-child .tl-rail s{display:none}
.tl-body{flex:1;min-width:0}
.tl-body .k{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.4px}
.tl-body .v{font-size:14.5px;font-weight:600;line-height:1.35;margin-top:1px;word-break:break-all}
.tl-body .p{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.tl-acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.mini{font-size:11.5px;font-weight:500;color:var(--purple);padding:4px 9px;
  background:var(--purple-s);border-radius:999px}
.mini.gray{color:var(--ink2);background:var(--surface2)}

.plan-acts{display:flex;gap:9px;margin-top:14px}
.plan-acts button{flex:1;height:42px;border-radius:var(--r-s);font-size:13.5px;font-weight:600;
  background:var(--surface2);color:var(--ink);transition:.14s}
.plan-acts button:active{transform:scale(.97)}
.plan-acts button.pri{background:var(--ink);color:#fff}

/* ---------- 标签 ---------- */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg{font-size:10.5px;padding:2.5px 7px;border-radius:5px;background:var(--surface2);color:var(--ink2);font-weight:500}
.tg.p{background:var(--purple-s);color:#5A4BD1}
.tg.c{background:var(--coral-s);color:#E0522F}
.tg.m{background:var(--mint-s);color:#0E8E6E}
.tg.a{background:var(--amber-s);color:#B87914}
.tg.b{background:var(--blue-s);color:#2C74CE}

/* ---------- 灵感/池子列表 ---------- */
.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .bul{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700}
.item .bul.p{background:var(--blue-s);color:#2C74CE}
.item .bul.e{background:var(--coral-s);color:#E0522F}
.item .bd{flex:1;min-width:0}
.item .bd .h{font-size:14px;font-weight:600;line-height:1.35}
.item .bd .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.item .bd .t{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.item .op{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.icon-btn{width:30px;height:30px;border-radius:9px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;transition:.14s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.add{background:var(--mint-s)}
.icon-btn.del{background:var(--coral-s)}

/* ---------- 输入 ---------- */
textarea{width:100%;min-height:92px;padding:12px;border-radius:var(--r-s);
  border:1px solid var(--line2);background:var(--surface2);resize:vertical;line-height:1.6;outline:none}
textarea:focus{border-color:var(--purple);background:#fff}
input[type=text],input[type=password],select{width:100%;height:42px;padding:0 12px;border-radius:var(--r-s);
  border:1px solid var(--line2);background:var(--surface2);outline:none}
input:focus,select:focus{border-color:var(--purple);background:#fff}
textarea::placeholder,input::placeholder{color:var(--ink3)}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row button{flex:1;height:44px;border-radius:var(--r-s);font-size:14px;font-weight:600;transition:.14s}
.btn-row button:active{transform:scale(.97)}
.btn-pri{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.26)}
.btn-sec{background:var(--surface2);color:var(--ink)}
.btn-g{flex:1;height:42px;border-radius:var(--r-s);background:var(--surface2);font-size:13px;font-weight:600}

/* ---------- 底栏导航 ---------- */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;
  width:100%;max-width:480px;padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  background:rgba(251,248,243,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;gap:4px;z-index:50;
}
.nav button{flex:1;height:52px;border-radius:var(--r-s);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--ink3);transition:.16s}
.nav button.on{color:var(--purple);background:var(--purple-s)}
.nav button svg{width:20px;height:20px}
.nav button span{font-size:10.5px;font-weight:600;letter-spacing:.3px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:rgba(34,32,28,.9);color:#fff;font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.28s;z-index:99;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 空态 ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:13px;line-height:1.8}
.empty b{display:block;font-size:14px;color:var(--ink2);margin-bottom:5px;font-weight:600}

.note{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:10px;
  padding:9px 11px;background:var(--surface2);border-radius:var(--r-s)}
.seg{display:flex;background:var(--surface2);border-radius:var(--r-s);padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.16s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(34,32,28,.08)}

</style>
</head>
<body>

<div id="app">
  <div class="top">
    <h1>今天干嘛<small>TIAN GANMA</small></h1>
    <div class="date"><b id="dToday">—</b><span id="dWeek">—</span></div>
  </div>

  <main>
    <section id="pgRoll">

      <div class="card cond" id="condCard">
        <div class="cond-head" id="condHead">
          <h2><span class="cond-dot"></span>今天什么情况</h2>
          <span class="cond-sum" id="condSum"></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="cond-body">
          <div class="row"><label>活动范围</label><div class="chips" data-k="scope">
            <button class="chip" data-v="city">主城区</button>
            <button class="chip" data-v="near">含近郊</button>
            <button class="chip" data-v="any">不限</button>
          </div></div>
          <div class="row"><label>怎么去</label><div class="chips" data-k="traffic">
            <button class="chip" data-v="car">开车</button>
            <button class="chip" data-v="metro">地铁</button>
            <button class="chip" data-v="walk">走路</button>
          </div></div>
          <div class="row"><label>人均预算</label><div class="chips" data-k="budget">
            <button class="chip" data-v="0">不限</button>
            <button class="chip" data-v="1">50 内</button>
            <button class="chip" data-v="2">100 内</button>
            <button class="chip" data-v="3">200 内</button>
          </div></div>
          <div class="row"><label>今天的状态</label><div class="chips" data-k="energy">
            <button class="chip" data-v="chill">躺平</button>
            <button class="chip" data-v="any">随便</button>
            <button class="chip" data-v="active">想动</button>
          </div></div>
          <div class="row"><label>玩多久</label><div class="chips" data-k="len">
            <button class="chip" data-v="full">一整天</button>
            <button class="chip" data-v="half">半天</button>
          </div></div>
          <div class="row"><label>摇过的</label><div class="chips" data-k="repeat">
            <button class="chip" data-v="norepeat">不再出现</button>
            <button class="chip" data-v="allow">允许重复</button>
          </div></div>
          <div class="row">
            <label>附近实时数据（可选）</label>
            <input type="password" id="amapKey" placeholder="高德 Web 服务 Key，不填就用本地池">
            <div class="btn-row">
              <button class="btn-g" id="btnLive">拉取附近</button>
              <button class="btn-g" id="btnLiveClear">清空实时数据</button>
            </div>
            <div class="note" id="liveNote">不填也能用。</div>
          </div>
        </div>
      </div>

      <div class="machine" id="machine">
        <div class="machine-t">
          <span class="lb">摇出你们的一天</span>
          <span class="hint">点某一格可单独换</span>
        </div>
        <div class="reels" id="reels">
          <div class="reel" data-type="p" data-label="上午 · 玩"><div class="strip"></div></div>
          <div class="reel" data-type="e" data-label="中午 · 吃"><div class="strip"></div></div>
          <div class="reel" data-type="p" data-label="下午 · 玩"><div class="strip"></div></div>
        </div>
        <div class="lever" id="lever"><div class="knob"></div><div class="stick"></div></div>
        <button class="spin-btn" id="btnSpin">拉 一 下</button>
      </div>

      <div class="card">
        <div class="card-t">
          <h2>今天这样过</h2>
          <span class="lnk" id="planCount"></span>
        </div>
        <div id="planBox"><div class="plan-empty">还没摇。<br>拉一下那根杆，今天就不用想了。</div></div>
        <div class="plan-acts" id="planActs" style="display:none">
          <button id="btnRerollAll">全部重摇</button>
          <button id="btnCopyPlan">复制计划</button>
          <button class="pri" id="btnSaveCombo">存进池子</button>
        </div>
      </div>
    </section>

    <section id="pgIdea" class="hide">
      <div class="card">
        <div class="card-t"><h2>粘贴一个点子进来</h2></div>
        <textarea id="pasteBox" placeholder="刷到好玩的、朋友推荐的，直接粘在这里。一行一个，用句号分开也行。"></textarea>
        <div class="btn-row">
          <button class="btn-sec" id="btnPasteClear">清空</button>
          <button class="btn-pri" id="btnParse">解析成条目</button>
        </div>
      </div>

      <div class="card" id="candCard" style="display:none">
        <div class="card-t"><h2>待确认</h2><span class="lnk" id="candCount"></span></div>
        <div id="candBox"></div>
        <div class="btn-row"><button class="btn-pri" id="btnCandAll">全部加进池子</button></div>
      </div>

      <div class="card">
        <div class="card-t"><h2>换一批灵感</h2><span class="lnk" id="btnMoreIdeas">换一批</span></div>
        <div id="ideaBox"></div>
        <div class="note">标「报道」的是从公开报道整理的，标「AI」的是生成的。去之前都建议先搜一下确认还在不在。</div>
      </div>
    </section>

    <section id="pgPool" class="hide">
      <div class="card">
        <input type="text" id="poolSearch" placeholder="搜名字 / 区域 / 标签" style="margin-bottom:12px">
        <div class="seg" id="poolSeg">
          <button class="on" data-v="all">全部</button>
          <button data-v="p">玩的</button>
          <button data-v="e">吃的</button>
          <button data-v="u">我加的</button>
          <button data-v="x">拉黑</button>
        </div>
        <div id="poolBox"></div>
      </div>

      <div class="card">
        <div class="card-t"><h2>手动加一条</h2></div>
        <input type="text" id="addName" placeholder="名字，比如「家楼下新开的串串」">
        <div class="chips" id="addType" style="margin-top:10px">
          <button class="chip on" data-v="p">玩的</button>
          <button class="chip" data-v="e">吃的</button>
        </div>
        <div class="btn-row"><button class="btn-pri" id="btnAdd">加进池子</button></div>
      </div>

      <div class="card">
        <div class="card-t"><h2>收藏的组合</h2><span class="lnk" id="comboClear">清空</span></div>
        <div id="comboBox"></div>
      </div>

      <div class="card">
        <div class="card-t"><h2>维护</h2></div>
        <div class="btn-row">
          <button class="btn-sec" id="btnResetRecent">清空「摇过的」</button>
          <button class="btn-sec" id="btnResetAll">恢复出厂</button>
        </div>
        <div class="note" id="statNote"></div>
      </div>
    </section>
  </main>

  <nav class="nav" id="nav">
    <button data-p="roll" class="on">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="12" r="1.6" fill="currentColor"/><circle cx="15.5" cy="12" r="1.6" fill="currentColor"/></svg>
      <span>摇一摇</span>
    </button>
    <button data-p="idea">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-3.3 11v2h6.6v-2A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.7"/><path d="M10 19h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>

var IC_EAT  = '<svg viewBox="0 0 24 24"><path d="M2 11.5h20a10 10 0 0 1-20 0Z" fill="currentColor"/><path d="M9 3.5v5M12 2.5v6M15 3.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>';

var IC_SPORT= '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v18M3.5 12h17" stroke="currentColor" stroke-width="1.5" opacity=".55"/></svg>';

var C_PURPLE='#6C5CE7', C_CORAL='#FF6B4A', C_MINT='#17B890', C_AMBER='#F5A623', C_BLUE='#3B8DF0';
var RAMP = [C_PURPLE, C_CORAL, C_MINT, C_AMBER, C_BLUE];

var EAT_WORDS = ['吃','餐','饭','火锅','串串','烧烤','咖啡','茶','酒','面','粉','甜品','小吃','包','饼','日料','烤肉','brunch','西餐','食堂','早餐','夜宵','汤','鸭','鸡','鱼','牛','饺','抄手','锅盔','兔'];
var BOOK_SUBS = ['书店','展览','博物馆'];
var NIGHT_SUBS = ['夜生活','演出','酒吧'];
var SPORT_SUBS = ['运动'];

/* ===================== 状态 ===================== */
function defState(){
  return {
    cond:{scope:'city',traffic:'car',budget:0,energy:'any',len:'full',repeat:'norepeat'},
    custom:[], banned:[], fav:[], recent:[], combos:[],
    amapKey:'', amapArea:'锦江', live:[], ideasSeen:[],
    cand:[]
  };
}
var S = defState();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      var d = defState();
      for(var k in d){ if(o[k]!==undefined) d[k]=o[k]; }
      for(var k2 in d.cond){ if(!o.cond || o.cond[k2]===undefined) d.cond[k2]=defState().cond[k2]; }
      S = d;
    }
  }catch(e){ S = defState(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ===================== 数据 ===================== */
var LIB = [];
function buildLib(){
  var raw = window.POOL_RAW || [];
  LIB = raw.map(function(r,i){ return mk(r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],'L'+i,'lib'); });
}
function mk(name,type,sub,area,price,dur,tags,tip,id,src){
  return {
    id:id, name:name, type:type, sub:sub, area:area,
    price:price||2, dur:dur||2,
    tags:String(tags||'').split(',').map(function(s){return s.trim();}).filter(Boolean),
    tip:tip||'', src:src||'lib'
  };
}
function allItems(){
  return LIB.concat(S.custom, S.live);
}
function byId(id){
  var a = allItems();
  for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; }
  return null;
}
function isBanned(id){ return S.banned.indexOf(id)>=0; }
function isFav(id){ return S.fav.indexOf(id)>=0; }
function inCity(it){ return it.area==='不限' || CITY.indexOf(it.area)>=0; }
function isFar(it){ return FAR.indexOf(it.area)>=0; }
function hasTag(it,t){ return it.tags.indexOf(t)>=0; }
function subIn(it,arr){ return arr.indexOf(it.sub)>=0; }

function walkable(it){
  if(it.area!=='不限' && CITY.indexOf(it.area)<0) return false;
  if(it.type==='e') return it.price<=2;
  return ['公园','街区','活动','咖啡','茶'].indexOf(it.sub)>=0 || it.dur<=1.5;
}

/* ===================== 筛选与抽取 ===================== */
var LIGHT_SUBS = ['甜品','咖啡','茶'];                 /* 不适合当正餐 */
var FULL_SUBS  = ['火锅','串串','川菜','家常','面食','烧烤','夜宵','异国','粤菜','日料','韩餐','西餐','素食','早餐','不限'];

function isNightOnly(it){
  return hasTag(it,'夜生活') || it.sub==='酒吧' || it.sub==='夜生活';
}
function passesCond(it){
  var c = S.cond;
  if(isBanned(it.id)) return false;
  if(c.scope==='city' && !inCity(it)) return false;
  if(c.scope==='near' && isFar(it)) return false;
  if(c.budget>0 && it.price>Number(c.budget)) return false;
  if(c.energy==='chill' && hasTag(it,'体力活')) return false;
  if(c.traffic==='walk' && !walkable(it)) return false;
  if(c.repeat==='norepeat' && S.recent.indexOf(it.id)>=0 && !isFav(it.id)) return false;
  return true;
}
function poolOf(type, skipIds){
  var skip = skipIds||[];
  return allItems().filter(function(it){
    if(it.type!==type) return false;
    if(skip.indexOf(it.id)>=0) return false;
    return passesCond(it);
  });
}
function relaxed(type, skipIds){
  var p = poolOf(type, skipIds);
  if(p.length>=4) return p;
  var old = S.cond;
  var tmp = JSON.parse(JSON.stringify(old));
  tmp.repeat = 'allow'; tmp.energy = 'any'; tmp.budget = 0; tmp.traffic = 'car';
  S.cond = tmp;
  p = poolOf(type, skipIds);
  S.cond = old;
  if(p.length) return p;
  return allItems().filter(function(it){ return it.type===type && !isBanned(it.id); });
}
function weighted(p){
  if(!p || !p.length) return null;
  var tot=0, w=[];
  for(var i=0;i<p.length;i++){ var x = isFav(p[i].id)?3:1; w.push(x); tot+=x; }
  var r = Math.random()*tot;
  for(var j=0;j<p.length;j++){ r-=w[j]; if(r<=0) return p[j]; }
  return p[p.length-1];
}
/* 软过滤：候选够多才剔除，否则保留，避免筛到没东西 */
function soft(list, fn, min){
  var f = list.filter(fn);
  return f.length >= (min||6) ? f : list;
}
function pickItem(type, skipIds){ return weighted(relaxed(type, skipIds)); }

function pickPlay(skip, isMorning){           /* 白天玩：排除只有晚上才成立的 */
  var p = relaxed('p', skip);
  p = soft(p, function(it){ return !isNightOnly(it); }, 6);
  /* "住一晚"这类整日项目塞不进一天的格子 */
  p = soft(p, function(it){ return (it.dur||2) < 12; }, 6);
  /* 上午别排长项目，否则"午饭"要排到下午去；下午也别长到把晚上拖进后半夜 */
  if(isMorning) p = soft(p, function(it){ return (it.dur||2) <= 3; }, 6);
  else          p = soft(p, function(it){ return (it.dur||2) <= 5; }, 6);
  return weighted(p) || pickItem('p', skip);
}
function pickMeal(skip, isLunch){              /* 饭点：优先正餐，中午排除夜宵和酒吧 */
  var p = relaxed('e', skip);
  p = soft(p, function(it){ return FULL_SUBS.indexOf(it.sub)>=0; }, 8);
  p = soft(p, function(it){ return LIGHT_SUBS.indexOf(it.sub)<0; }, 8);
  if(isLunch){
    p = soft(p, function(it){ return !hasTag(it,'夜宵') && it.sub!=='酒吧'; }, 8);
  }
  return weighted(p) || pickItem('e', skip);
}
function pickNight(skip){                      /* 晚上那一站 */
  var p = allItems().filter(function(it){
    return isNightOnly(it) && skip.indexOf(it.id)<0 && passesCond(it);
  });
  if(p.length<3){
    p = allItems().filter(function(it){ return isNightOnly(it) && skip.indexOf(it.id)<0 && !isBanned(it.id); });
  }
  return weighted(p);
}

/* ===================== 时间轴 ===================== */
var plan = [];
function fmt(m){ m = Math.round(m/10)*10; var h=Math.floor(m/60), mi=m%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
/* 排到半夜以后写"次日 01:10"，不印 25:10 这种怪时间 */
function fmtWrap(m){
  m = Math.round(m/10)*10;
  var next = false;
  while(m >= 1440){ m -= 1440; next = true; }
  var h = Math.floor(m/60), mi = m%60;
  return (next?'次日 ':'') + (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}

function buildPlan(rolls){
  plan = [];
  var half = S.cond.len==='half';
  var t = 10*60;
  var used = [];

  if(rolls[0]){ plan.push({t:t,label:'玩',type:'p',item:rolls[0],slot:0}); t += rolls[0].dur*60; used.push(rolls[0].id); }
  if(rolls[1]){ t = Math.max(t+40, 12*60); plan.push({t:t,label:'午饭',type:'e',item:rolls[1],slot:1}); t += rolls[1].dur*60; used.push(rolls[1].id); }
  if(half) return;

  if(rolls[2]){ t = Math.max(t+40, 14*60); plan.push({t:t,label:'玩',type:'p',item:rolls[2],slot:2}); t += rolls[2].dur*60; used.push(rolls[2].id); }

  var din = pickMeal(used, false);
  if(din){ t = Math.max(t+40, 18*60); plan.push({t:t,label:'晚饭',type:'e',item:din,slot:3,auto:true}); t += din.dur*60; used.push(din.id); }

  var night = pickNight(used);
  if(night){ t = Math.max(t+40, 20*60); plan.push({t:t,label:'晚上',type:night.type,item:night,slot:4,auto:true}); }
}

/* ===================== 摇 ===================== */
var rolls = [null,null,null];
var rolling = false;

function iconOf(it){
  if(subIn(it,BOOK_SUBS)) return IC_BOOK;
  if(subIn(it,NIGHT_SUBS)) return IC_MOON;
  if(subIn(it,SPORT_SUBS)) return IC_SPORT;
  return it.type==='e' ? IC_EAT : IC_PLAY;
}
function colorOf(it){
  var s = it.sub||'x', h=0;
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return RAMP[h % RAMP.length];
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function slotLabel(i){
  if(i===0) return '上午 · 玩';
  if(i===1) return '中午 · 吃';
  if(i===2) return '下午 · 玩';
  return '晚上 · 吃';
}
function cellHTML(it,label){
  if(!it) return '<div class="cell"><div class="nm" style="color:var(--ink3)">—</div></div>';
  return '<div class="cell">'+
    '<div class="ic" style="color:'+colorOf(it)+'">'+iconOf(it)+'</div>'+
    '<div class="tag">'+esc(label)+'</div>'+
    '<div class="nm">'+esc(it.name)+'</div>'+
  '</div>';
}
function reelEls(){ return Array.prototype.slice.call(document.querySelectorAll('#reels .reel')); }

function rollReel(reel, item, dur){
  var strip = reel.querySelector('.strip');
  var type = reel.getAttribute('data-type');
  var label = reel.getAttribute('data-label');
  var filler = [];
  var src = relaxed(type, []);
  for(var i=0;i<18;i++){ filler.push(src[Math.floor(Math.random()*src.length)]); }
  var seq = filler.concat([item]);
  strip.innerHTML = seq.map(function(x){ return cellHTML(x,label); }).join('');
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(0px)';
  void strip.offsetHeight;
  strip.style.transition = 'transform '+dur+'s cubic-bezier(.13,.75,.24,1)';
  strip.style.transform = 'translateY(' + (-(seq.length-1)*ROW_H) + 'px)';
}

function doSpin(){
  if(rolling) return;
  rolling = true;
  var btn = document.getElementById('btnSpin');
  btn.disabled = true;
  btn.textContent = '在摇了…';
  var mach = document.getElementById('machine');
  mach.classList.add('rolling');
  document.getElementById('lever').classList.add('pulled');
  if(navigator.vibrate) try{ navigator.vibrate([12,40,12]); }catch(e){}

  var els = reelEls();
  var half = S.cond.len==='half';
  var count = half ? 2 : 3;
  var types = half ? ['p','e'] : ['p','e','p'];
  var used = [];

  for(var i=0;i<count;i++){
    var it = i===1 ? pickMeal(used, true) : pickPlay(used, i===0);
    if(it) used.push(it.id);
    rolls[i] = it;
  }
  if(half) rolls[2] = null;

  var longest = 0;
  for(var j=0;j<els.length;j++){
    if(j>=count){ els[j].style.visibility='hidden'; continue; }
    els[j].style.visibility='visible';
    var d = 1.05 + j*0.26;
    if(d>longest) longest = d;
    (function(el,item,delay){
      setTimeout(function(){ rollReel(el, item, delay); }, 60);
    })(els[j], rolls[j], d);
  }

  setTimeout(function(){
    mach.classList.remove('rolling');
    document.getElementById('lever').classList.remove('pulled');
    for(var k=0;k<count;k++){ els[k].classList.add('win'); (function(e){ setTimeout(function(){e.classList.remove('win');},450); })(els[k]); }
    if(navigator.vibrate) try{ navigator.vibrate(16); }catch(e){}
    // 记录
    for(var m=0;m<count;m++){
      var id = rolls[m] && rolls[m].id;
      if(id && S.recent.indexOf(id)<0) S.recent.unshift(id);
    }
    if(S.recent.length>90) S.recent = S.recent.slice(0,90);
    buildPlan(rolls);
    save();
    renderPlan();
    rolling = false;
    btn.disabled = false;
    btn.textContent = '再 拉 一 下';
  }, 60 + (longest*1000) + 260);
}

function spinOne(idx){
  if(rolling) return;
  if(S.cond.len==='half' && idx>1) return;
  rolling = true;
  var el = reelEls()[idx];
  var used = rolls.filter(Boolean).map(function(x){return x.id;});
  var it = idx===1 ? pickMeal(used, true) : pickPlay(used, idx===0);
  rolls[idx] = it;
  el.classList.add('win');
  rollReel(el, it, 1.15);
  setTimeout(function(){
    el.classList.remove('win');
    if(it && S.recent.indexOf(it.id)<0) S.recent.unshift(it.id);
    if(S.recent.length>90) S.recent = S.recent.slice(0,90);
    buildPlan(rolls);
    renderPlan(); save();
    rolling = false;
  }, 1350);
}

function swapPlanRow(slot){
  if(rolling) return;
  var used = rolls.filter(Boolean).map(function(x){return x.id;});
  if(slot===3 || slot===4){
    plan.forEach(function(p){ if(p.slot===3 || p.slot===4) used.push(p.item.id); });
    if(slot===3){
      var din = pickMeal(used, false);
      plan.forEach(function(p){ if(p.slot===3) p.item = din; });
    }else{
      var nt = pickNight(used);
      plan.forEach(function(p){ if(p.slot===4) p.item = nt; });
    }
    renderPlan(); save();
    return;
  }
  spinOne(slot);
}

function guessType(s){
  for(var i=0;i<EAT_WORDS.length;i++){
    if(s.toLowerCase().indexOf(EAT_WORDS[i].toLowerCase())>=0) return 'e';
  }
  return 'p';
}
function parsePaste(txt){
  var parts = txt.split(/\n+|。|！|？|；|;|(?:\d{1,2}[\.、)）])/);
  var out = [], seen = {};
  parts.forEach(function(s){
    s = s.trim().replace(/^[-•·*\s]+/,'').replace(/^[\(（].{0,3}[\)）]/,'').trim();
    if(s.length<2 || s.length>38) return;
    if(seen[s]) return; seen[s]=1;
    out.push({ name:s, type:guessType(s) });
  });
  return out.slice(0,20);
}

/* ===================== 高德实时 ===================== */
function amapKey(){ return (S.amapKey||'').trim(); }
function fetchLive(){
  var key = amapKey();
  if(!key){ toast('先填高德 Key'); return; }
  var run = function(lng,lat,label){
    var tasks = [
      {types:'050000|050500', radius:3000, kind:'e', label:label},
      {types:'110000|110100|060300', radius:5000, kind:'p', label:label}
    ];
    var got = [], total = tasks.length, doneN = 0, netErr = 0;
    $('btnLive').textContent = '拉取中…';
    tasks.forEach(function(t){
      var url = 'https://restapi.amap.com/v3/place/around?key='+encodeURIComponent(key)+
        '&location='+lng.toFixed(6)+','+lat.toFixed(6)+
        '&types='+encodeURIComponent(t.types)+
        '&radius='+t.radius+'&offset=25&page=1&extensions=base';
      fetch(url).then(function(r){ return r.json(); }).then(function(j){
        if(j && j.status==='0'){
          netErr++;
        }
        if(j && j.pois){
          j.pois.forEach(function(p){
            got.push({
              id:'R'+p.id, name:p.name, type:t.kind,
              sub:subFromType(p.type), area:t.label,
              price:2, dur:t.kind==='e'?1.5:2,
              tags:['实时','附近'],
              tip:(p.address&&typeof p.address==='string'?p.address:'')+(p.distance?' · 约'+Math.round(Number(p.distance))+'米':''),
              src:'live', dist:Number(p.distance||9999)
            });
          });
        }
        doneN++;
        if(doneN===total){ finish(); }
      }).catch(function(){ doneN++; netErr++; if(doneN===total) finish(); });
    });
    function finish(){
      got = got.filter(function(x){ return x.name && x.dist<=4000; })
               .sort(function(a,b){ return a.dist-b.dist; }).slice(0,120);
      S.live = got;
      save(); renderLiveNote(); renderPool();
      if(got.length){
        $('btnLive').textContent = '已拉 '+got.length+' 条';
        toast('拉到 '+got.length+' 条附近数据，已经进池子了');
      }else{
        $('btnLive').textContent = '拉取失败';
        toast(netErr>=total
          ? '被浏览器拦了。这个页面是本地打开的，联网请求会被拦，用本地池就行'
          : '没拉到数据，看看 Key 和类型权限对不对');
      }
      setTimeout(function(){ $('btnLive').textContent='拉取附近'; },2600);
    }
  };
  var fallback = function(){
    var a = S.amapArea || '锦江';
    var c = AREAS[a] || AREAS['锦江'];
    run(c[0], c[1], a);
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){ run(p.coords.longitude, p.coords.latitude, '我附近'); },
      fallback, {timeout:6000, maximumAge:60000}
    );
  } else fallback();
}
function subFromType(t){
  if(!t) return '附近';
  var a = String(t).split(';')[0].split('|');
  var last = a[a.length-1] || '附近';
  return last.length>6 ? last.slice(-4) : last;
}

    $('poolSeg').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    renderPool();
  });
  $('poolSearch').addEventListener('input', function(){ poolQ = $('poolSearch').value.trim(); renderPool(); });
  $('poolBox').addEventListener('click', function(e){
    var f = e.target.closest('[data-fav]'), b = e.target.closest('[data-ban]');
    if(f){
      var id = f.getAttribute('data-fav'), i = S.fav.indexOf(id);
      if(i>=0) S.fav.splice(i,1); else S.fav.push(id);
      save(); renderPool();
    }else if(b){
      var id2 = b.getAttribute('data-ban'), j = S.banned.indexOf(id2);
      if(j>=0) S.banned.splice(j,1); else S.banned.push(id2);
      save(); renderPool();
    }
  });
  $('addType').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    $('addType').querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x===b); });
  });
  $('btnAdd').addEventListener('click', function(){
    var n = $('addName').value.trim();
    if(!n){ toast('写个名字'); return; }
    var t = $('addType').querySelector('.chip.on').getAttribute('data-v');
    addCustom(n,t); $('addName').value=''; save(); renderPool(); renderPool();
    toast('加好了');
  });
  $('comboBox').addEventListener('click', function(e){
    var d = e.target.closest('[data-cdelcombo]');
    if(d){ S.combos.splice(Number(d.getAttribute('data-cdelcombo')),1); save(); renderCombos(); }
  });
  $('comboClear').addEventListener('click', function(){ S.combos=[]; save(); renderCombos(); toast('清空了'); });
  $('btnResetRecent').addEventListener('click', function(){ S.recent=[]; save(); renderPool(); toast('「摇过的」记录清了，老地方会重新出现'); });
  $('btnResetAll').addEventListener('click', function(){
    if(!confirm('会清掉你自己加的所有条目和收藏，确定吗？')) return;
    localStorage.removeItem(KEY); S = defState(); location.reload();
  });

  // 实时
  $('amapKey').addEventListener('change', function(){ S.amapKey = $('amapKey').value.trim(); save(); renderLiveNote(); });
  $('amapKey').addEventListener('blur', function(){ S.amapKey = $('amapKey').value.trim(); save(); renderLiveNote(); });
  $('btnLive').addEventListener('click', fetchLive);
  $('btnLiveClear').addEventListener('click', function(){ S.live=[]; save(); renderLiveNote(); renderPool(); toast('实时数据清了'); });

  // 导航
  $('nav').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var p = b.getAttribute('data-p');
    $('nav').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    $('pgRoll').classList.toggle('hide', p!=='roll');
    $('pgIdea').classList.toggle('hide', p!=='idea');
    $('pgPool').classList.toggle('hide', p!=='pool');
    window.scrollTo({top:0, behavior:'smooth'});
    if(p==='pool') renderPool();
    if(p==='idea') renderIdeas();
  });
}

function copy(txt){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); });
    return true;
  }
  return legacyCopy(txt);
}
function legacyCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0';
  ta.style.opacity='0.01'; ta.style.fontSize='16px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  ta.setSelectionRange(0, t.length);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}

/* ===================== 启动 ===================== */
function initDate(){
  var d = new Date();
  var w = ['日','一','二','三','四','五','六'][d.getDay()];
  $('dToday').textContent = (d.getMonth()+1)+' 月 '+d.getDate()+' 日';
  $('dWeek').textContent = '星期'+w;
}

function init(){
  load(); buildLib(); initDate(); bind(); renderCond(); renderMachine(); renderPlan();
  save();
  var first = new Date().getHours();
  if(first>=6 && first<11) $('condCard').classList.add('open');
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
